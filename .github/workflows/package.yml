name: Native package

on:
  pull_request:
    paths:
      - "lightllm/**"
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "VERSION"
      - "docker/Dockerfile"
      - "installer/manifest.json"
      - "requirements/**"
      - "tools/install.py"
      - "unit_tests/test_cli.py"
      - "unit_tests/test_distribution.py"
      - "unit_tests/test_installer.py"
      - "test/test_api/test_anthropic_extra_body.py"
      - ".github/workflows/package.yml"
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Wheel build channel
        type: choice
        default: nightly
        options: [nightly, stable]

jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'schedule' || inputs.channel == 'nightly') && '["3.12"]' || '["3.10", "3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Select package version
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("VERSION")
          version = path.read_text().strip()
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match VERSION"
          elif os.environ["GITHUB_EVENT_NAME"] == "schedule" or os.environ["BUILD_CHANNEL"] == "nightly":
              major, minor, patch = map(int, version.split("."))
              version = f"{major}.{minor}.{patch + 1}.dev{os.environ['GITHUB_RUN_NUMBER']}"
              path.write_text(version + "\n")
          print(f"Building lightllm {version}")
          PY
      - name: Install packaging tools
        run: python -m pip install uv==0.13.5
      - name: Build wheels
        run: |
          uv build --wheel
          LIGHTLLM_CUDA_PROFILE=cuda128 uv build --wheel
          LIGHTLLM_DOCKER_BUILD=1 uv build --wheel --out-dir "$RUNNER_TEMP/docker-wheel"
      - name: Include installer manifest in the release artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = Path("VERSION").read_text().strip()
          manifest_path = Path("installer/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          dist = Path("dist")
          for profile in manifest["profiles"]:
              suffix = "+cu128" if profile["name"] == "cuda128" else ""
              profile["wheel"] = f"lightllm-{version}{suffix}-py3-none-any.whl"
              assert (dist / profile["wheel"]).is_file(), profile["wheel"]
              requirements = manifest_path.parent / profile["requirements"]
              profile["requirements"] = requirements.name
              (dist / requirements.name).write_bytes(requirements.read_bytes())
          (dist / "installer-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (dist / "lightllm-install.py").write_bytes(Path("tools/install.py").read_bytes())
          PY
      - name: Run the bundled installer and check dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/installer-bin" "$RUNNER_TEMP/installer-bundle"
          printf '#!/bin/sh\nprintf "580.95.05\\n"\n' > "$RUNNER_TEMP/installer-bin/nvidia-smi"
          chmod +x "$RUNNER_TEMP/installer-bin/nvidia-smi"
          cp dist/* "$RUNNER_TEMP/installer-bundle/"
          (
            cd "$RUNNER_TEMP/installer-bundle"
            export PATH="$RUNNER_TEMP/installer-bin:$PATH"
            python lightllm-install.py --venv "$GITHUB_WORKSPACE/.venv" --python "${{ matrix.python-version }}"
            python lightllm-install.py --profile cuda128 --venv "$RUNNER_TEMP/cuda128" --python "${{ matrix.python-version }}"
          )
          uv pip install --python .venv/bin/python pytest
          uv pip check
          uv pip freeze > dist/installed-py${{ matrix.python-version }}.txt
          uv pip check --python "$RUNNER_TEMP/cuda128/bin/python"
          uv pip freeze --python "$RUNNER_TEMP/cuda128/bin/python" > dist/installed-cu128-py${{ matrix.python-version }}.txt
      - name: Verify installed versions and check native ABI when CUDA is available
        run: |
          export LIGHTLLM_BUILD_VERSION="$(cat VERSION)"
          cd "$RUNNER_TEMP"
          for profile in cuda13 cuda128; do
            target_python="$GITHUB_WORKSPACE/.venv/bin/python"
            if [ "$profile" = cuda128 ]; then
              target_python="$RUNNER_TEMP/cuda128/bin/python"
            fi
            "$target_python" - "$profile" <<'PY'
          import os
          import sys
          from importlib.metadata import version

          import torch

          cuda128 = sys.argv[1] == "cuda128"
          expected_version = os.environ["LIGHTLLM_BUILD_VERSION"] + ("+cu128" if cuda128 else "")
          assert version("lightllm") == expected_version, (sys.argv[1], version("lightllm"))
          assert torch.version.cuda == ("12.8" if cuda128 else "13.0"), torch.version.cuda
          if torch.cuda.is_available():
              from sgl_kernel import causal_conv1d_fwd, causal_conv1d_update
          else:
              print("Native ABI and model validation require a GPU runner; this artifact is not GPU-validated.")
          PY
          done
      - name: Verify the installed package outside the checkout
        run: |
          export LIGHTLLM_TEST_WHEEL="$(realpath "dist/lightllm-$(cat VERSION)-py3-none-any.whl")"
          export LIGHTLLM_TEST_CUDA128_WHEEL="$(realpath dist/*+cu128-*.whl)"
          export LIGHTLLM_TEST_DOCKER_WHEEL="$(realpath "$RUNNER_TEMP"/docker-wheel/lightllm-*.whl)"
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          cd "$RUNNER_TEMP"
          cuda128/bin/lightllm serve --help
          cuda128/bin/python -c 'import cupy; import lightllm.server.api_start'
          lightllm --help
          lightllm serve --help
          lightllm serve --help-all
          python -m lightllm.server.api_server --help
          python -c 'import cupy; import lightllm.server.api_start; import lightllm.server.api_http; import lightllm.models.qwen3.model'
          python -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/unit_tests/test_cli.py" \
            "$GITHUB_WORKSPACE/unit_tests/test_distribution.py" \
            "$GITHUB_WORKSPACE/unit_tests/test_installer.py" \
            "$GITHUB_WORKSPACE/unit_tests/common/test_autotuner.py" \
            "$GITHUB_WORKSPACE/test/test_api/test_anthropic_extra_body.py"
      - uses: actions/upload-artifact@v4
        with:
          name: lightllm-dist-py${{ matrix.python-version }}
          path: dist/*
