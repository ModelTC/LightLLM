global
    log stdout format raw local0
    stats socket /root/lightllm-haproxy-60011/admin.sock mode 600 level operator

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend pd_1p1d_60011
    bind 0.0.0.0:60011
    default_backend pd_master_60011

backend pd_master_60011
    balance random(1)
    option httpchk GET /health
    http-check expect status 200
    server pd_master_1 10.119.25.62:60021 check inter 2s fall 3 rise 2
    server pd_master_2 10.119.25.62:60022 check inter 2s fall 3 rise 2
    server pd_master_3 10.119.25.62:60023 check inter 2s fall 3 rise 2
    server pd_master_4 10.119.25.62:60024 check inter 2s fall 3 rise 2
